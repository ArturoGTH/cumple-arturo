<style>
  :root {
    --bg: #0D0A0B; --surface: #1A1013; --surface-2: #26171C; --line: rgba(195, 198, 206, .18);
    --text: #F4EEE8; --muted: #B7AFAA; --accent: #D9B46A; --vino: #8C1A37; --coral: #FF6F59; --plata: #C3C6CE;
    --ok: #9BE3B4; --display: "Fraunces", Georgia, serif; --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 50% -10%, rgba(140, 26, 55, .45), transparent 70%), var(--bg); color: var(--text); font: 16px/1.5 var(--body); overflow-x: hidden; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 96px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; }
  .cab { text-align: center; padding: 6px 0 18px; }
  .cab-ceja { margin: 0; color: var(--coral); font-size: 12.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .cab h1 { font-size: clamp(34px, 9vw, 46px); line-height: 1.05; margin: 8px 0 6px; background: linear-gradient(100deg, #f3dca6, var(--accent) 45%, #fff3d6 60%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cab p { margin: 0 auto; max-width: 34ch; color: var(--muted); }
  .cab-foto { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); box-shadow: 0 0 0 6px rgba(217, 180, 106, .15); margin: 0 auto 10px; display: block; }
  .tarjeta { background: var(--surface); border: 1px solid rgba(217, 180, 106, .35); border-radius: 18px; padding: 16px; margin: 0 0 16px; box-shadow: 0 12px 34px rgba(0, 0, 0, .35); }
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; background: linear-gradient(100deg, var(--coral), var(--accent)); color: #241006; }
  .boton:disabled { opacity: .6; cursor: default; }
  .boton.sec { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .campo { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; margin: 6px 0 10px; }
  .campo:focus { outline: none; border-color: var(--accent); }
  .err { color: #ffab95; font-size: 14px; font-weight: 600; margin: 0 0 8px; min-height: 1px; }
  /* Progreso */
  .prog-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .prog-t b { font-family: var(--display); font-size: 22px; color: var(--accent); font-weight: 600; }
  .prog-t span { color: var(--muted); font-size: 14px; }
  .sellos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .sello { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 23px; border: 2px dashed rgba(195, 198, 206, .35); background: rgba(255, 255, 255, .03); filter: grayscale(1); opacity: .45; transition: all .4s ease; position: relative; }
  .sello.ok { border: 2px solid var(--accent); background: radial-gradient(circle at 35% 30%, #b02a4c, var(--vino) 60%, #4a0c1d); filter: none; opacity: 1; box-shadow: 0 0 0 4px rgba(217, 180, 106, .18), 0 0 18px rgba(217, 180, 106, .35); transform: rotate(-8deg); }
  .sello.ok::after { content: "✓"; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #241006; font-size: 13px; font-weight: 900; display: grid; place-items: center; }
  .sello.nuevo { animation: sello-pop .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes sello-pop { 0% { transform: scale(2.2) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  .completo { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; text-align: center; background: rgba(217, 180, 106, .14); border: 1px solid var(--accent); color: #f3dca6; font-weight: 700; }
  /* Misiones */
  .sec-t { font-family: var(--display); font-size: 24px; color: var(--accent); text-align: center; margin: 26px 0 12px; }
  .mision { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start; }
  .mision + .mision { margin-top: 0; }
  .m-ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: rgba(217, 180, 106, .12); border: 1px solid rgba(217, 180, 106, .4); }
  .m-lugar { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--coral); }
  .m-t { margin: 1px 0 3px; font-size: 18px; font-weight: 700; }
  .m-x { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .m-hecho { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 800; }
  .tarjeta.hecha { border-color: rgba(155, 227, 180, .45); background: linear-gradient(135deg, rgba(155, 227, 180, .06), var(--surface)); }
  .barra-sub { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; margin: 8px 0 4px; }
  .barra-sub i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--coral)); transition: width .2s ease; }
  .sub-txt { font-size: 13.5px; color: var(--muted); }
  input[type=file] { display: none; }
  .clave-fila { display: flex; gap: 8px; }
  .clave-fila .campo { margin: 0; text-transform: uppercase; }
  .clave-fila .boton { width: auto; white-space: nowrap; }
  /* Rompecabezas */
  .puzzle-fondo { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(5, 3, 4, .8); backdrop-filter: blur(3px); }
  .puzzle-fondo[hidden] { display: none; }
  .puzzle { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--accent); border-radius: 20px; padding: 16px; text-align: center; }
  .puzzle h3 { color: var(--accent); font-size: 24px; }
  .puzzle p { margin: 4px 0 12px; color: var(--muted); font-size: 14.5px; }
  .tablero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--accent); touch-action: manipulation; user-select: none; }
  .pieza { background-size: 300% 300%; cursor: pointer; transition: transform .15s ease, outline-color .15s ease; outline: 3px solid transparent; outline-offset: -3px; }
  .pieza.sel { outline-color: var(--coral); transform: scale(.94); }
  .puzzle-pie { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .puzzle-pie button { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; }
  .gano { font-size: 17px; color: #f3dca6 !important; font-weight: 700; }
  .ver-ref { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
  /* Ranking */
  .rank ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .rank li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .03); }
  .rank li.yo { background: rgba(217, 180, 106, .18); outline: 1px solid var(--accent); }
  .rank li b { color: var(--accent); }
  .rank .vacio { text-align: center; color: var(--muted); margin: 0; }
  .rank .premios li { display: block; padding: 2px 0; background: none; }
  .premios { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 14.5px; }
  /* Álbum */
  .album-lista { margin: 10px 0 0; display: grid; gap: 6px; font-size: 14px; }
  .album-lista .ok { color: var(--ok); }
  .album-lista .mal { color: #ffab95; }
  .aviso-demo { margin: 0 0 14px; padding: 9px 12px; border-radius: 12px; background: rgba(255, 111, 89, .12); border: 1px solid rgba(255, 111, 89, .4); color: #ffcabd; font-size: 13.5px; text-align: center; }
  .pie { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 26px; }
  .pie a { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(120px); z-index: 60; padding: 12px 18px; border-radius: 999px; background: var(--accent); color: #241006; font-weight: 800; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); transition: transform .35s ease; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
  .toast.ver { transform: translateX(-50%) translateY(0); }
  .confeti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
  /* ---------- Carrera de sellos ---------- */
  .pista { display: grid; gap: 4px; }
  .pista-cab { display: flex; justify-content: space-between; padding: 0 34px 0 30px; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .meta-t { color: var(--accent); }
  .carril { display: grid; grid-template-columns: 26px 1fr 34px; align-items: end; gap: 6px; padding: 26px 4px 8px; border-radius: 12px; border-bottom: 1px dashed rgba(195, 198, 206, .15); }
  .carril.top { background: linear-gradient(90deg, rgba(217, 180, 106, .1), transparent 70%); }
  .carril.yo { background: rgba(217, 180, 106, .16); outline: 1px solid rgba(217, 180, 106, .6); }
  .carril-pos { font-weight: 800; color: var(--muted); font-size: 14px; text-align: center; padding-bottom: 1px; }
  .carril.top .carril-pos { color: var(--accent); }
  .carril-n { font-weight: 800; color: var(--accent); font-size: 13.5px; text-align: right; }
  .carril-via { position: relative; height: 10px; margin: 0 10px; }
  .carril-linea { position: absolute; left: 0; right: 0; top: 3px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .carril-linea i { display: block; height: 100%; background: linear-gradient(90deg, var(--vino), var(--coral), var(--accent)); border-radius: 999px; transition: width .8s ease; }
  .carril-puntos i { position: absolute; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--bg); border: 2px solid rgba(195, 198, 206, .35); }
  .carril-puntos i.pasado { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 6px rgba(217, 180, 106, .7); }
  .carril-puntos i.fin { width: 14px; height: 14px; margin-left: -7px; top: -2px; border-radius: 3px; background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 7px 7px; border: 1px solid var(--accent); }
  .corredor { position: absolute; bottom: 8px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: left .8s cubic-bezier(.3, 1.3, .5, 1); animation: corre 1.1s ease-in-out infinite; z-index: 2; }
  @keyframes corre { 0%, 100% { margin-bottom: 0; } 50% { margin-bottom: 3px; } }
  .c-nombre { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: var(--surface-2); border: 1px solid rgba(195, 198, 206, .35); max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .corredor.c1 .c-nombre { background: linear-gradient(100deg, #f3dca6, var(--accent)); color: #241006; border-color: #f3dca6; box-shadow: 0 0 12px rgba(217, 180, 106, .55); }
  .corredor.c2 .c-nombre { background: #d9dbe0; color: #1a1013; border-color: #fff; }

  .c-ico { font-size: 15px; line-height: 1; margin-top: 1px; }
  .corredor.izq { transform: translateX(-8px); align-items: flex-start; }
  .corredor.der { transform: translateX(calc(-100% + 8px)); align-items: flex-end; }
  .corredor.llego .c-ico { animation: baila 1s ease-in-out infinite; }
  .pista-nota { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: 13.5px; }
  .sim { margin-top: 12px; font-size: 14px; padding: 10px; }
  .rank-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: -4px 0 10px; }
  .act-txt { font-size: 12.5px; color: var(--muted); }
  .btn-act { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--accent); background: rgba(217, 180, 106, .12); color: var(--accent); font: inherit; font-weight: 800; font-size: 13.5px; cursor: pointer; }

  .mi-sep { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .1em; }

  .ver-carrera { display: block; margin-top: 12px; text-align: center; color: var(--accent); font-weight: 800; font-size: 14.5px; text-decoration: none; }
  #carrera { scroll-margin-top: 14px; }
  /* ---------- Caza del caramelo ---------- */
  .boton-caza { position: relative; background: linear-gradient(100deg, #b8893b, #f3dca6, #d9b46a); color: #241006; box-shadow: 0 0 18px rgba(217, 180, 106, .45); }
  .radar-mini { width: 10px; height: 10px; border-radius: 50%; background: #8c1a37; box-shadow: 0 0 0 0 rgba(140, 26, 55, .7); animation: ping 1.4s ease-out infinite; }

  .caza { position: fixed; inset: 0; z-index: 55; background: #000; }
  .caza[hidden] { display: none; }
  .caza-caja { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 35%, #5a1024, #1a0d10 70%); }
  .caza-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .caza-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 30px; background: linear-gradient(rgba(0, 0, 0, .7), transparent); color: #f3dca6; font-size: 17px; z-index: 3; }

          choco.rotation.y += dt * 1.1; choco.position.y += Math.sin(t * 2) * .003; haz.material.opacity *= .94;
          if (Math.random() < dt * 8) explotar(choco.position.clone(), 1, 1.4);
        }
        for (var k = 0; k < nP; k++) { if (posP[k * 3 + 1] < -50) continue; velP[k].y -= dt * 1.8; posP[k * 3] += velP[k].x * dt; posP[k * 3 + 1] += velP[k].y * dt; posP[k * 3 + 2] += velP[k].z * dt; if (posP[k * 3 + 1] < -6) posP[k * 3 + 1] = -99; }
        gP.attributes.position.needsUpdate = true;
        if (estado === "vivo" && Math.random() < dt * 6) explotar(regalo.position.clone().add(tmp.set(0, 1.1, 0)), 1, 1.2);
        ren.render(esc, cam);
        requestAnimationFrame(cuadro);
      }
      requestAnimationFrame(cuadro);
      function alRedimensionar() { W = cont.clientWidth; H = cont.clientHeight; ren.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); }
      window.addEventListener("resize", alRedimensionar);
      return {
        pos: function () {
          var v = regalo.position.clone().project(cam);
          var borde = regalo.position.clone().add(tmp.set(1.1 * regalo.scale.x, 0, 0)).project(cam);
          return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, r: Math.max(56, Math.abs(borde.x - v.x) / 2 * W) };
        },
        golpe: function () {
          salto = 1; explotar(regalo.position.clone(), 18, 3.2);
          var L = lim(); obj.set((Math.random() * 2 - 1) * L.x, (Math.random() * 2 - 1) * L.y, (Math.random() - .5) * 1.5);
        },
        abrir: function () {
          return new Promise(function (ok) {
            estado = "abriendo"; tAbre = 0; fin = ok; obj.set(0, -1.2, 0); regalo.position.lerp(obj, .5);
            explotar(regalo.position.clone().add(tmp.set(0, 1, 0)), 80, 4.5);
          });
        },
        destruir: function () { vivo = false; window.removeEventListener("resize", alRedimensionar); ren.dispose(); },
      };
    }
    return { crear: crear };
  }

  function cazarCaramelo() {
    if (sellos.m8) { toast("¡Ya lo atrapaste! 🙌"); return; }
    var m8 = P.misiones.filter(function (x) { return x.id === "m8"; })[0];
    if (m8 && !activa(m8)) { toast("🔒 Esta misión se activa a las " + fmtHora(m8.desde)); return; }
    if (cerrado()) { toast("🏁 El pasaporte ya cerró"); return; }
    var C = P.caramelo || {};
    var fondo = document.getElementById("puzzle"); fondo.innerHTML = ""; fondo.className = "caza"; fondo.hidden = false;
    var video = el("video", { class: "caza-video", playsinline: true, muted: true, autoplay: true });
    var estado = el("p", { class: "caza-estado", text: "Abriendo la cámara…" });
    var radar = el("div", { class: "radar", "aria-hidden": "true" }, el("i"), el("i"), el("i"));
    var escena = el("div", { class: "caza-escena" });
    var cerrarB = el("button", { type: "button", class: "caza-x", "aria-label": "Cerrar", text: "×" });
    var respaldo = el("div", { class: "caza-respaldo", hidden: true });
    fondo.appendChild(el("div", { class: "caza-caja" }, video, radar, escena,
      el("div", { class: "caza-top" }, el("strong", { text: "🔍 Busca " + (C.nombre || "el regalo perdido") }), cerrarB),
      el("div", { class: "caza-pie" }, estado, respaldo)));
    var stream = null, vivo = true, leer = null, encontrado = false;
    function apagar() { vivo = false; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); video.style.visibility = "hidden"; }
    function volverAlPasaporte() {
      cerrar();
      confeti(180);
      var z = zonaProgreso; if (z) z.scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(function () {
        var sl = z && z.querySelectorAll(".sello")[P.misiones.length - 1];
        if (sl) { sl.classList.remove("nuevo"); void sl.offsetWidth; sl.classList.add("nuevo"); }
        toast("🎁 ¡Sello del regalo conseguido! Llevas " + total() + " de " + P.misiones.length);
      }, 450);
    }
    function cerrar() { apagar(); if (ctl3d) { ctl3d.destruir(); ctl3d = null; } fondo.hidden = true; fondo.className = "puzzle-fondo"; fondo.innerHTML = ""; }
    cerrarB.addEventListener("click", cerrar);
    function mostrarRespaldo(msg) {
      estado.textContent = msg;
      respaldo.hidden = false; respaldo.innerHTML = "";
      var campo = el("input", { class: "campo", type: "text", maxlength: "20", placeholder: "Código de la tarjeta", autocapitalize: "characters", "aria-label": "Código de la tarjeta dorada" });
      var b = el("button", { class: "boton", type: "button", text: "✨ Revelar" });
      b.addEventListener("click", function () {
        if (campo.value.trim().toUpperCase() === String(C.respaldo || "").toUpperCase()) aparecer(); else toast("Ese no es el código 😜 ¡Sigue buscando!");
      });
      respaldo.appendChild(el("div", { class: "clave-fila" }, campo, b));
    }
    function escanear() {
      if (!vivo || encontrado) return;
      if (video.readyState < 2) { setTimeout(escanear, 200); return; }
      leer(video).then(function (txt) {
        if (!vivo || encontrado) return;
        if (txt && txt.trim() === C.codigo) { aparecer(); return; }
        if (txt) estado.textContent = "Esa no es la tarjeta dorada 😜 ¡Sigue buscando!";
        setTimeout(escanear, 220);
      }).catch(function () { setTimeout(escanear, 400); });
    }
    // Aparece el caramelo flotando sobre la cámara: hay que tocarlo 3 veces para atraparlo
    var tres = null;      // promesa del regalo 3D (se precarga al abrir el buscador)
    var ctl3d = null;
    function aparecer() {
      if (encontrado) return; encontrado = true;
      radar.classList.add("hallado");
      if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (e) {}
      respaldo.hidden = true;
      var N = C.toques || 5, toques = 0, bloqueado = false;
      estado.textContent = "Abriendo la sorpresa…";
      (tres || Promise.reject()).then(function (R) { return R.crear(escena); }).then(function (ctl) {
        ctl3d = ctl; window.__regalo3d = ctl; radar.hidden = true;
        estado.textContent = "¡Ahí está! Tócalo " + N + " veces para atraparlo ✨";
        escena.addEventListener("pointerdown", function (e) {
          if (bloqueado) return;
          var r = escena.getBoundingClientRect(), g = ctl.pos();
          var dx = e.clientX - r.left - g.x, dy = e.clientY - r.top - g.y;
          if (Math.sqrt(dx * dx + dy * dy) > g.r * 1.2) return;
          toques++;
          if (navigator.vibrate) try { navigator.vibrate(30); } catch (er) {}
          if (toques < N) { ctl.golpe(); estado.textContent = frase(toques, N); return; }
          bloqueado = true; estado.textContent = "¡Atrapado! Abriendo… ✨";
          ctl.abrir().then(function () { confeti(160); guardar(function () { escena.appendChild(exito()); }); });
        });
      }).catch(function () { aparecer2D(N); });   // si el 3D no carga, versión simple
    }
    function frase(t, N) { var fr = C.frases || []; return (t === N - 1 ? fr[fr.length - 1] : fr[(t - 1) % Math.max(1, fr.length - 1)]) || "¡Se escapó! 💨"; }
    function guardar(listo) {
      apagar();
      post({ tipo: "sello", id: id, nombre: nombre, mision: "m8", clave: P.clave }).then(function (r) {
        if (r && r.ok === false) throw new Error(r.error);
        estado.textContent = ""; var pie = fondo.querySelector(".caza-pie"); if (pie) pie.style.display = "none";
        listo(); marcar("m8");
      }).catch(function () { estado.textContent = "¡Lo abriste! Pero no se pudo guardar el sello. Revisa tu señal y vuelve a intentarlo."; encontrado = false; });
    }
    function aparecer2D(N) {
      var toques = 0;
      estado.textContent = "¡Ahí está! Tócalo " + N + " veces para atraparlo ✨";
      var b = el("button", { type: "button", class: "regalo2d", "aria-label": "Tócalo para atraparlo", text: "🎁" });
      b.style.left = "50%"; b.style.top = "45%"; escena.appendChild(b);
      b.addEventListener("click", function () {
        toques++;
        if (toques < N) { estado.textContent = frase(toques, N); b.style.left = (15 + Math.random() * 70) + "%"; b.style.top = (22 + Math.random() * 46) + "%"; return; }
        b.disabled = true; b.textContent = "🍫"; confeti(160);
        setTimeout(function () { guardar(function () { escena.appendChild(exito()); }); }, 700);
      });
    }
    function exito() {
      var b = el("button", { class: "boton", type: "button", text: "¡Listo! 🎉" });
      b.addEventListener("click", volverAlPasaporte);
      return el("div", { class: "puzzle caza-ok regalo-ok" },
        el("h3", { text: "¡Encontraste " + (C.nombre || "el regalo perdido") + "!" }),
        el("p", { class: "gano", text: "¡Adentro había un chocolate! 🍫 Acércate a Arturo, muéstrale esta pantalla y canjéalo." }), b);
    }
    tres = cargarRegalo3D(); tres.catch(function () {});
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { radar.hidden = true; mostrarRespaldo("Tu celular no permite abrir la cámara aquí. Escribe el código que está en la tarjeta dorada:"); return; }
    Promise.all([
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }),
      cargarLector().catch(function () { return null; }),
    ]).then(function (res) {
      stream = res[0]; leer = res[1];
      if (!vivo) { apagar(); return; }
      video.srcObject = stream; video.play().catch(function () {});
      if (!leer) { mostrarRespaldo("No se pudo activar el buscador. Escribe el código de la tarjeta dorada:"); return; }
      estado.textContent = "Apunta tu cámara a la tarjeta dorada escondida en la casa…";
      escanear();
    }).catch(function () {
      radar.hidden = true;
      mostrarRespaldo("Necesitamos tu permiso para usar la cámara. Si no quieres, escribe el código de la tarjeta dorada:");
    });
  }

  // ---------- confeti ----------
  function confeti(n) {
    var cv = el("canvas", { class: "confeti" }); document.body.appendChild(cv);
    var W = innerWidth, H = innerHeight, d = Math.min(2, devicePixelRatio || 1), c = cv.getContext("2d");
    cv.width = W * d; cv.height = H * d; c.setTransform(d, 0, 0, d, 0, 0);
    var col = ["#d9b46a", "#f3dca6", "#ff6f59", "#c3c6ce", "#8c1a37"], ps = [];
    for (var i = 0; i < n; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, w: 6 + Math.random() * 5, h: 3 + Math.random() * 4, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: col[i % 5] });
    var t0 = performance.now();
    (function paso(t) {
      c.clearRect(0, 0, W, H);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); });
      if (t - t0 < 3800) requestAnimationFrame(paso); else cv.remove();
    })(t0);
  }

  // brillitos de fondo (por detrás del contenido)
  (function () {
    var capa = el("div", { class: "fondo-brillos", "aria-hidden": "true" });
    var f = ["✦", "✧", "✨", "·", "✦", "⋆"];
    for (var i = 0; i < 22; i++) capa.appendChild(el("span", { text: f[i % f.length],
      style: "left:" + (Math.random() * 100).toFixed(1) + "%;font-size:" + (8 + Math.random() * 12).toFixed(0) + "px;animation-duration:" + (9 + Math.random() * 10).toFixed(1) + "s,2.4s;animation-delay:-" + (Math.random() * 18).toFixed(1) + "s,-" + (Math.random() * 2.4).toFixed(1) + "s" }));
    document.body.prepend(capa);
  })();
  // ---------- Reloj de prueba (solo modo prueba, o con ?clave=) ----------
  function relojPrueba() {
    if (!MODO_RELOJ) return;
    var horas = ["17:30", "18:00", "19:00", "19:59", "20:00", "21:00", "21:59", "22:00", "22:30", "22:59", "23:00", "23:30"];
    var b = el("button", { type: "button", class: "reloj-b" });
    var g = el("div", { class: "reloj-g" });
    var panel = el("div", { class: "reloj-p", hidden: true },
      el("p", { text: "⏰ Reloj de prueba: elige una hora del 7 de noviembre para ver qué misiones se activan. (Los invitados no ven esto.)" }), g);
    var elegida = prueba ? params.get("hora") : null;
    function etiqueta() {
      var lima = new Date(ahora() - 5 * 3600000);
      var hh = ("0" + lima.getUTCHours()).slice(-2) + ":" + ("0" + lima.getUTCMinutes()).slice(-2);
      b.textContent = "⏰ " + (prueba ? fmtHora(hh) + " · prueba" : "Hora real");
      Array.prototype.forEach.call(g.children, function (x) { x.classList.toggle("act", x.getAttribute("data-h") === elegida); });
    }
    function ir(hh) { elegida = hh; fijarHora(hh); revisarHorario(false); if (zonaProgreso) pintar(); etiqueta(); }
    horas.forEach(function (h) { var x = el("button", { type: "button", "data-h": h, text: fmtHora(h).replace(" p. m.", "") }); x.addEventListener("click", function () { ir(h); }); g.appendChild(x); });
    var real = el("button", { type: "button", text: "🕒 Hora real" });
    real.addEventListener("click", function () { ir(null); });
    var borrar = el("button", { type: "button", text: "🧹 Borrar mis sellos" });
    borrar.addEventListener("click", function () { sellos = {}; guarda(LS.sellos, "{}"); try { localStorage.removeItem(LS.rank); } catch (e) {} if (nombre) principal(); toast("Sellos borrados (solo en este celular)"); });
    panel.appendChild(el("div", { class: "reloj-x" }, real, API ? null : borrar));
    b.addEventListener("click", function () { panel.hidden = !panel.hidden; });
    document.body.appendChild(el("div", { class: "reloj" }, panel, b));
    etiqueta(); setInterval(etiqueta, 15000);
  }
  relojPrueba();
  if (nombre) principal(); else pantallaNombre();
})();
