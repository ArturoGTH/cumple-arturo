<style>
  :root {
    --bg: #0d0a0b;            /* negro cálido */
    --surface: #1a1013;       /* negro vino */
    --surface-2: #2a141c;
    --line: rgba(201, 204, 211, .16);   /* plata */
    --text: #f6f1ec;
    --muted: #c3c6ce;          /* plata */
    --accent: #d9b46a;         /* dorado champán */
    --accent-ink: #231806;
    --vino: #8c1a37;           /* burdeos */
    --ok: #d9b46a;
    --ok-ink: #231806;
    --coral: #ff6f59;          /* coral */
    --wa: #25d366;
    --radius: 18px;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 560px at 85% -10%, rgba(140, 26, 55, .55), transparent 62%),
      radial-gradient(700px 480px at 0% 10%, rgba(255, 111, 89, .14), transparent 60%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 16px 64px; }

  .aviso {
    margin: 12px auto 0; max-width: 660px; padding: 8px 14px;
    border: 1px dashed var(--accent); border-radius: 12px;
    color: var(--accent); font-size: 13.5px; text-align: center;
  }

  /* ---------- Portada ---------- */
  header { padding: 44px 0 8px; text-align: center; position: relative; }
  header > *:not(.brillos) { position: relative; z-index: 1; }
  .brillos { position: absolute; top: 0; left: calc(50% - 50vw); width: 100vw; height: 100%; z-index: 0; pointer-events: none; }
  .confeti { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none; }
  body { overflow-x: hidden; }
  .foto {
    width: 112px; height: 112px; margin: 0 auto 22px; border-radius: 50%;
    display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(140deg, var(--vino), var(--coral) 60%, var(--accent));
    color: #fff8ef;
    font-family: var(--display); font-size: 52px; font-weight: 600;
    box-shadow: 0 0 0 5px var(--bg), 0 0 0 6px var(--line);
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.con-img {
    width: 148px; height: 148px; padding: 0; background: var(--bg); overflow: visible;
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 0 6px #d9b46a,
      0 0 0 11px rgba(13, 10, 11, 0),
      0 0 0 12px rgba(243, 220, 166, .75),
      0 0 46px 14px rgba(217, 180, 106, .22);
  }
  .foto.con-img img { border-radius: 50%; }
  /* ---------- Tira de fotos tipo película ---------- */
  .filme {
    position: relative; overflow: hidden; margin-top: 14px;
    background: #050405; border-block: 1px solid rgba(201, 204, 211, .12);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .cinta { display: flex; width: max-content; }
  .cuadro {
    --alto: clamp(150px, 42vw, 210px);
    flex: none; padding: 20px 7px;
    /* perforaciones de la película, arriba y abajo */
    background-image:
      linear-gradient(90deg, transparent 5px, rgba(230, 232, 236, .78) 5px 15px, transparent 15px),
      linear-gradient(90deg, transparent 5px, rgba(230, 232, 236, .78) 5px 15px, transparent 15px);
    background-size: 20px 9px, 20px 9px;
    background-position: left 0 top 6px, left 0 bottom 6px;
    background-repeat: round no-repeat, round no-repeat;
  }
  .marco {
    width: max-content; margin: 0; padding: 6px;
    background: #fbfaf7; border-radius: 2px;
  }
  .marco .img { height: calc(var(--alto) * .82); overflow: hidden; background: #e9e6e1; }
  .marco img { height: 100%; width: auto; display: block; }
  .marco .vacia { width: calc(var(--alto) * .82); }
  .marco .vacia {
    width: 100%; height: 100%; display: grid; place-items: center; text-align: center;
    background: linear-gradient(150deg, var(--vino), var(--coral) 75%, var(--accent));
    color: rgba(255, 248, 239, .9); font-size: 12.5px; font-weight: 500;
  }
  .marco figcaption {
    width: 0; min-width: 100%;
    height: 26px; padding: 4px 2px 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: "Caveat", "Segoe Script", cursive; font-size: 19px; line-height: 28px; color: #2a1a20;
  }
  /* La tira avanza sola y además se puede deslizar con el dedo o arrastrar con el mouse */
  .filme { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab; touch-action: pan-x pan-y; }
  .filme::-webkit-scrollbar { display: none; }
  .filme.agarrando { cursor: grabbing; user-select: none; }
  .filme img { -webkit-user-drag: none; user-select: none; }
  #filme-abajo .filme { margin: 8px 0 0; }
  #pie footer { margin-top: 24px; }
  .wrap#app { padding-bottom: 24px; }
  header.con-filme { padding-top: 30px; }
  .ceja {
    margin: 0 0 6px; color: var(--coral); font-size: 13px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 500; font-style: italic;
    font-size: clamp(54px, 17vw, 96px); line-height: .95; letter-spacing: -.02em;
    text-wrap: balance;
    color: var(--accent);
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 {
      background: linear-gradient(100deg, #f3dca6 0%, var(--accent) 45%, #e6e8ec 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      padding-bottom: .06em;
    }
  }
  .sub { margin: 10px 0 0; font-family: var(--display); font-weight: 600; font-size: clamp(22px, 6vw, 30px); }
  .mensaje { margin: 18px auto 0; max-width: 46ch; color: var(--muted); text-wrap: pretty; }
  .sub.arriba {
    margin: 0 0 6px; color: var(--coral); font-family: var(--body); font-weight: 700;
    font-size: 14px; letter-spacing: .2em; text-transform: uppercase;
  }
  header .foto { margin: 24px auto 4px; }
  .mensaje { color: var(--text) !important; font-size: 17px; }
  .cita { margin: 18px auto 0; max-width: 40ch; padding: 0 8px; }
  .cita p {
    margin: 0; font-family: var(--display); font-style: italic; font-weight: 500;
    font-size: 18px; line-height: 1.45; color: var(--muted); text-wrap: balance;
  }
  .cita cite { display: block; margin-top: 6px; font-style: normal; font-size: 13.5px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
  .cita::before { content: ""; display: block; width: 44px; height: 1px; margin: 0 auto 16px; background: var(--accent); opacity: .7; }
  .cuenta {
    display: inline-block; margin-top: 20px; padding: 7px 16px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--line); font-size: 14.5px; font-weight: 500;
  }
  .cuenta b { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- Secciones ---------- */
  section { margin-top: 44px; }
  h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 600; font-size: 27px; line-height: 1.15; text-wrap: balance; }
  .intro { margin: 0 0 18px; color: var(--muted); }
  .tarjeta {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
  }

  .detalles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detalles .tarjeta { padding: 16px; }
  .detalles .ancho { grid-column: 1 / -1; }
  .etq { margin: 0 0 3px; color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .val { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .nota { margin: 5px 0 0; color: var(--muted); font-size: 14.5px; }

  /* ---------- Formulario ---------- */
  label, legend { display: block; margin: 0 0 6px; font-size: 14.5px; font-weight: 700; padding: 0; }
  .campo { margin-bottom: 16px; }
  input[type="text"] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  input[type="text"]::placeholder { color: #858891; }
  input[type="text"]:focus-visible, .opcion input:focus-visible + span, .boton:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opcion { margin: 0; cursor: pointer; }
  .opcion input { position: absolute; opacity: 0; pointer-events: none; }
  .opcion span {
    display: block; padding: 12px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); text-align: center; font-weight: 500;
  }
  .opcion input:checked + span { background: rgba(217, 180, 106, .14); border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
  .opcion input:checked + span::before { content: "✓ "; }
  .botones { display: grid; gap: 10px; }
  .boton {
    display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
    padding: 14px 16px; border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 700; text-decoration: none;
    background: var(--accent); color: var(--accent-ink);
  }
  .boton.wa { background: var(--wa); color: #03240f; }
  .boton:disabled { opacity: .6; cursor: default; }
  .boton svg { width: 20px; height: 20px; flex: none; }
  .estado { margin: 14px 0 0; padding: 11px 14px; border-radius: 12px; font-size: 14.5px; display: none; }
  .estado.ver { display: block; }
  .estado.bien { background: rgba(217, 180, 106, .14); color: var(--ok); }
  .estado.mal { background: rgba(255, 111, 89, .14); color: #ffab95; }
  .privado { margin: 14px 0 0; color: var(--muted); font-size: 13.5px; }

  /* ---------- Aportes ---------- */
  .resumen { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .resumen .monto { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .resumen .de { color: var(--muted); font-size: 15px; }
  .barra { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--vino), var(--coral)); }
  .lista { display: grid; gap: 12px; margin-top: 14px; }
  .item-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .item h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .item .det { margin: 2px 0 12px; color: var(--muted); font-size: 14.5px; }
  .chip {
    flex: none; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .chip.ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  .item .cifras { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .item .cifras span:last-child { color: var(--muted); }
  .gracias { margin: 10px 0 0; font-size: 14.5px; color: var(--muted); }
  .gracias b { color: var(--text); font-weight: 500; }
  .item.cerrado .barra i { background: var(--ok); }
  .item.cerrado h3 { color: var(--ok); }

  .traer { display: grid; gap: 0; padding: 4px 18px; }
  .traer-fila { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
  .traer-fila:first-child { border-top: 0; }
  .traer-fila strong { font-size: 16.5px; }
  .traer-fila .quien { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; }
  .traer-fila .cuanto { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .traer-fila.cerrado strong { color: var(--ok); }

  .botella { margin: 16px 0 0; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 15px; text-align: center; }
  .botella a { color: var(--accent); font-weight: 700; }
  /* ---------- Ventana "llevar algo" ---------- */
  .llevar-cta { margin-top: 16px; text-align: center; border-style: dashed; }
  .llevar-t { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 600; }
  .llevar-s { margin: 4px 0 14px; color: var(--muted); font-size: 15px; }
  html.sin-scroll { overflow: hidden; }
  .ventana {
    width: min(560px, calc(100% - 24px)); max-height: min(86vh, 760px); padding: 0;
    border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text);
    display: none; flex-direction: column; overflow: hidden;
  }
  .ventana[open] { display: flex; }
  .ventana::backdrop { background: rgba(5, 3, 4, .72); backdrop-filter: blur(3px); }
  .v-cab { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 18px 18px 10px; }
  .v-cab h3 { margin: 0; font-family: var(--display); font-size: 23px; font-weight: 600; line-height: 1.2; }
  .v-cab p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
  .v-cerrar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 24px; line-height: 1; cursor: pointer; }
  .ll-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 18px 6px; padding: 4px; background: var(--bg); border-radius: 12px; }
  .ll-tab { padding: 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; }
  .ll-tab.activa { background: var(--surface-2); color: var(--accent); }
  .v-cuerpo { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 18px 8px; -webkit-overflow-scrolling: touch; }
  .ll-nota { margin: 8px 0 6px; color: var(--muted); font-size: 13.5px; }
  .ll-fila { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer; margin: 0; position: relative; }
  .ll-fila:first-of-type { border-top: 0; }
  .ll-fila input { position: absolute; left: 4px; top: 50%; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .ll-check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; }
  .ll-fila input:checked + .ll-check { background: var(--accent); border-color: var(--accent); }
  .ll-fila input:checked + .ll-check::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .ll-fila input:focus-visible + .ll-check { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ll-txt { display: grid; gap: 1px; min-width: 0; }
  .ll-txt strong { font-size: 16px; }
  .ll-txt small { color: var(--muted); font-size: 13.5px; }
  .ll-quien { color: var(--accent) !important; }
  .ll-fila.cubierto { opacity: .55; cursor: default; }
  .v-pie { padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--surface); }
  /* ---------- Cantidades, nombre en ventana, Yape aviso, música ---------- */
  .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .stepper[hidden] { display: none; }
  .st-b { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1; }
  .st-n { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ll-barra { display: block; height: 4px; margin-top: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; max-width: 160px; }
  .ll-barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--vino), var(--coral)); }
  .v-pie { display: grid; gap: 10px; }
  .v-pie .estado { margin: 0; }
  .v-nombre, .yape-aviso input, .yape-aviso select {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; min-width: 0;
  }
  .v-wa { color: var(--accent); font-weight: 700; text-align: center; font-size: 14.5px; }
  .ya-caja { margin-top: 12px; text-align: center; }
  .ya-abrir { width: 100%; }
  .yape-aviso { display: grid; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .yape-aviso[hidden] { display: none; }
  .ya-fila.dos { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  .silencio {
    position: fixed; right: 132px; bottom: 16px; z-index: 20; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid rgba(217, 180, 106, .5);
    background: rgba(26, 16, 19, .92); color: var(--accent); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); backdrop-filter: blur(6px);
  }
  .silencio svg { width: 22px; height: 22px; }
  .silencio.apagado { color: var(--muted); }
  .sp-panel {
    position: fixed; right: 16px; bottom: 74px; z-index: 21; width: min(360px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid rgba(217, 180, 106, .45); border-radius: 18px; padding: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
    opacity: 0; transform: translateY(14px); pointer-events: none; visibility: hidden;
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  .sp-panel.abierto { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .2s ease, transform .2s ease; }
  .sp-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 10px; font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--accent); }
  .sp-x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  .sp-marco { border-radius: 12px; overflow: hidden; background: #121212; }
  .sp-marco iframe { display: block; border: 0; }
  .sp-nota { margin: 8px 2px 0; color: var(--muted); font-size: 12.5px; }
  body.con-musica .wrap { padding-bottom: 96px; }
  .musica {
    position: fixed; right: 16px; bottom: 16px; z-index: 20; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; border-radius: 999px; border: 1px solid rgba(217, 180, 106, .5);
    background: rgba(26, 16, 19, .92); color: var(--accent); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5); backdrop-filter: blur(6px);
  }
  .m-ico { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
  .musica:not(.sonando) .m-ico { display: none; }
  .musica.sonando .m-nota { display: none; }
  .m-ico i { width: 3px; height: 6px; background: currentColor; border-radius: 2px; }
  .musica.sonando .m-ico i { animation: eq .9s ease-in-out infinite; }
  .musica.sonando .m-ico i:nth-child(2) { animation-delay: .2s; }
  .musica.sonando .m-ico i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }
  @media (prefers-reduced-motion: reduce) { .musica.sonando .m-ico i { animation: none; height: 12px; } }

    var arena = el("div", { class: "jg-arena" }, img, capa);
    var bMax = el("button", { type: "button", class: "jg-b", "aria-label": "Maximizar", title: "Maximizar", text: "⤢" });
    var bX = el("button", { type: "button", class: "jg-b", "aria-label": "Cerrar juego", title: "Cerrar", text: "×" });
    var ventana = el("div", { class: "jg-ventana", role: "dialog", "aria-modal": "true", "aria-label": J.titulo || "Atrapa a Arturo" },
      el("div", { class: "jg-cab" }, el("strong", { text: J.titulo || "🎯 Atrapa a Arturo" }), el("span", { class: "jg-acc" }, bMax, bX)),
      hud, arena);
    var fondo = el("div", { class: "jg-fondo", hidden: true }, ventana);
    document.body.appendChild(fondo);

    // ---- ranking (se guarda en tu hoja de Google; sin conexión, solo en este celular) ----
    var rankingLista = null;
    function rankingLocal() { try { return JSON.parse(localStorage.getItem("cumple-ja-ranking") || "[]"); } catch (e) { return []; } }
    function cargarRanking(listo) {
      if (!API_URL) { rankingLista = rankingLocal(); if (listo) listo(); return; }
      fetch(API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") + "accion=ranking&t=" + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (E) { rankingLista = (E && E.ranking) || []; if (listo) listo(); })
        .catch(function () { if (rankingLista === null) rankingLista = []; if (listo) listo(); });
    }
    function corto(n) { var p = String(n).trim().split(/\s+/); return p[0] + (p[1] ? " " + p[1].charAt(0).toUpperCase() + "." : ""); }
    function sumarLocal(nombre, pts) {
      var l = (rankingLista || []).slice(), c = corto(nombre), k = -1;
      l.forEach(function (x, i) { if (norm(x.n) === norm(c)) k = i; });
      if (k < 0) l.push({ n: c, p: pts }); else if (pts > l[k].p) l[k].p = pts;
      l.sort(function (a, b) { return b.p - a.p; });
      rankingLista = l.slice(0, 10);
      if (!API_URL) try { localStorage.setItem("cumple-ja-ranking", JSON.stringify(rankingLista)); } catch (e) {}
      return c;
    }
    function tablaRanking(resaltar) {
      var caja = el("div", { class: "jg-rank" }, el("p", { class: "jg-rank-t", text: "🏆 Ranking" }));
      if (rankingLista === null) { caja.appendChild(el("p", { class: "jg-rank-v", text: "Cargando…" })); return caja; }
      if (!rankingLista.length) { caja.appendChild(el("p", { class: "jg-rank-v", text: "¡Aún no hay nadie! Sé el primero 😎" })); return caja; }
      var medallas = ["🥇", "🥈", "🥉"];
      caja.appendChild(el("ol", null, rankingLista.slice(0, 10).map(function (x, i) {
        return el("li", { class: resaltar && norm(x.n) === norm(resaltar) ? "yo" : null },
          el("span", { class: "jg-pos", text: medallas[i] || (i + 1) + "." }), el("span", { class: "jg-rn", text: x.n }), el("b", { text: String(x.p) }));
      })));
      return caja;
    }

    var FRASES = J.frases || ["¡Ay! 😅", "¡Me atrapaste!", "¡Otra vez no!", "¡Eres rápido!", "¡Suéltame! 😂", "¡Eso dolió!", "¡Bien ahí!"];
    function pantalla(titulo, texto, botones, extra) {
      capa.innerHTML = ""; capa.hidden = false; capa.scrollTop = 0;
      capa.appendChild(el("div", { class: "jg-pant" },
        el("img", { class: "jg-mini", src: foto, alt: "" }),
        el("p", { class: "jg-pt", text: titulo }),
        texto ? el("p", { class: "jg-ps", text: texto }) : null,
        el("div", { class: "jg-bs" }, botones),
        extra || null));
    }
    function inicio() {
      hudP.textContent = "0"; hudT.textContent = String(DURACION);
      var b = el("button", { type: "button", class: "boton jg-go", text: "▶ ¡Empezar!" });
      b.addEventListener("click", empezar);
      var primera = true;
      var mostrar = function () { if (!jugando && (primera || capa.querySelector(".jg-go") === b)) primera = false, pantalla(J.titulo || "¡Atrapa a Arturo!", J.instrucciones || ("Toca mi cara todas las veces que puedas en " + DURACION + " segundos. Cada vez iré más rápido 😜"), [b], tablaRanking()); };
      mostrar(); cargarRanking(mostrar);
      img.hidden = true;
    }
    function medidas() { var r = arena.getBoundingClientRect(); return { w: r.width, h: r.height }; }
    function colocar() { img.style.width = img.style.height = cara.t + "px"; img.style.transform = "translate(" + cara.x + "px," + cara.y + "px)"; }
    function saltar() {
      var m = medidas();
      cara.x = Math.random() * Math.max(1, m.w - cara.t); cara.y = Math.random() * Math.max(1, m.h - cara.t);
      var ang = Math.random() * Math.PI * 2; cara.vx = Math.cos(ang) * cara.vel; cara.vy = Math.sin(ang) * cara.vel;
      colocar();
    }
    function empezar() {
      puntos = 0; restante = DURACION; cara.t = Math.min(96, Math.max(70, medidas().w / 4.5)); cara.vel = 150;
      hudP.textContent = "0"; hudT.textContent = String(DURACION);
      capa.hidden = true; img.hidden = false; saltar();
      jugando = true; ult = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(bucle);
      clearInterval(reloj);
      reloj = setInterval(function () {
        restante--; hudT.textContent = String(Math.max(0, restante));
        if (restante <= 0) terminar();
      }, 1000);
    }
    function bucle(t) {
      if (!jugando) return;
      var dt = ult ? Math.min(0.05, (t - ult) / 1000) : 0; ult = t;
      var m = medidas();
      cara.x += cara.vx * dt; cara.y += cara.vy * dt;
      if (cara.x < 0) { cara.x = 0; cara.vx = Math.abs(cara.vx); }
      if (cara.y < 0) { cara.y = 0; cara.vy = Math.abs(cara.vy); }
      if (cara.x > m.w - cara.t) { cara.x = m.w - cara.t; cara.vx = -Math.abs(cara.vx); }
      if (cara.y > m.h - cara.t) { cara.y = m.h - cara.t; cara.vy = -Math.abs(cara.vy); }
      if (Math.random() < dt * 0.8) { var a = Math.random() * Math.PI * 2; cara.vx = Math.cos(a) * cara.vel; cara.vy = Math.sin(a) * cara.vel; }  // cambia de rumbo de sorpresa
      colocar();
      raf = requestAnimationFrame(bucle);
    }
    function globo(texto, x, y, clase) {
      var g = el("span", { class: "jg-globo " + (clase || ""), text: texto, style: "left:" + x + "px;top:" + y + "px" });
      arena.appendChild(g); setTimeout(function () { g.remove(); }, 800);
    }
    img.addEventListener("pointerdown", function (e) {
      if (!jugando) return; e.preventDefault(); e.stopPropagation();
      puntos++; hudP.textContent = String(puntos);
      var r = arena.getBoundingClientRect();
      globo("+1 " + FRASES[Math.floor(Math.random() * FRASES.length)], e.clientX - r.left, e.clientY - r.top, "bien");
      img.classList.remove("golpe"); void img.offsetWidth; img.classList.add("golpe");
      cara.vel = Math.min(520, cara.vel * 1.12); cara.t = Math.max(46, cara.t - 2.5);
      saltar();
      if (navigator.vibrate) try { navigator.vibrate(25); } catch (er) {}
    });
    arena.addEventListener("pointerdown", function (e) {
      if (!jugando || e.target !== arena) return;
      var r = arena.getBoundingClientRect();
      globo("¡Fallaste! 😜", e.clientX - r.left, e.clientY - r.top, "mal");
    });
    function terminar() {
      jugando = false; clearInterval(reloj); cancelAnimationFrame(raf); img.hidden = true;
      var nuevo = puntos > record;
      if (nuevo) { record = puntos; hudR.textContent = String(record); try { localStorage.setItem("cumple-ja-record", String(record)); } catch (e) {} }
      var msj = puntos >= 25 ? "¡Nivel leyenda! Nadie me atrapa así 🏆" : puntos >= 15 ? "¡Eres rapidísimo! 🔥" : puntos >= 8 ? "¡Nada mal! ¿Otra? 😎" : "Uy… soy muy rápido para ti 😂";
      var otra = el("button", { type: "button", class: "boton jg-go", text: "🔁 Jugar otra vez" });
      otra.addEventListener("click", empezar);
      var extra = null;
      if (puntos > 0) {
        var campo = el("input", { type: "text", class: "jg-nom", maxlength: "20", placeholder: "Tu nombre, apodo o iniciales", autocomplete: "off", "aria-label": "Tu nombre o apodo para el ranking (opcional)" });
        var guardar = el("button", { type: "button", class: "boton jg-guardar", text: "🏆 Guardar mi puntaje" });
        var saltar = el("button", { type: "button", class: "jg-saltar", text: "No, gracias" });
        var form = el("div", { class: "jg-form con-burbuja" },
          el("p", { class: "jg-opc", text: "¿Quieres salir en el ranking? Es opcional 😉" }), campo, guardar, saltar);
        saltar.addEventListener("click", function () { form.remove(); });
        campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") guardar.click(); });
        var zona = el("div", null, tablaRanking());
        guardar.addEventListener("click", function () {
          var n = String(campo.value || "").trim().replace(/\s+/g, " ");
          if (n.length < 2) return burbuja(campo, "Escribe al menos 2 letras (o toca «No, gracias»).");
          if (API_URL) enviarApi({ tipo: "puntaje", nombre: n, puntos: puntos }).catch(function () {});
          var c = sumarLocal(n, puntos);
          form.replaceWith(el("p", { class: "jg-ok", text: "✅ ¡Listo, " + n.split(" ")[0] + "! Ya estás en el ranking." }));
          zona.innerHTML = ""; zona.appendChild(tablaRanking(c));
          if (API_URL) setTimeout(function () { cargarRanking(function () { zona.innerHTML = ""; zona.appendChild(tablaRanking(c)); }); }, 2500);
        });
        extra = el("div", null, form, zona);
      }
      pantalla((nuevo && puntos > 0 ? "¡Nuevo récord! " : "") + "Me atrapaste " + puntos + " " + (puntos === 1 ? "vez" : "veces"), msj, [otra], extra);
      if (puntos >= 8) confeti(80, true);
    }
    function abrir() {
      fondo.hidden = false; document.documentElement.classList.add("sin-scroll");
      requestAnimationFrame(function () { fondo.classList.add("visible"); });
      if (!jugando) inicio();
    }
    function cerrarJuego() {
      jugando = false; clearInterval(reloj); cancelAnimationFrame(raf);
      fondo.classList.remove("visible"); ventana.classList.remove("max");
      bMax.textContent = "⤢"; bMax.setAttribute("aria-label", "Maximizar"); bMax.title = "Maximizar";
      document.documentElement.classList.remove("sin-scroll");
      setTimeout(function () { fondo.hidden = true; }, 200);
    }
    btn.addEventListener("click", abrir);
    bX.addEventListener("click", cerrarJuego);
    fondo.addEventListener("click", function (e) { if (e.target === fondo) cerrarJuego(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !fondo.hidden) cerrarJuego(); });
    bMax.addEventListener("click", function () {
      var max = ventana.classList.toggle("max");
      bMax.textContent = max ? "⤡" : "⤢"; bMax.setAttribute("aria-label", max ? "Restaurar tamaño" : "Maximizar"); bMax.title = max ? "Restaurar" : "Maximizar";
      if (jugando) { var m = medidas(); cara.x = Math.min(cara.x, m.w - cara.t); cara.y = Math.min(cara.y, m.h - cara.t); }
    });
  }

  // ---------- arranque ----------
  function render(D) {
    var app = document.getElementById("app");
    var nombreEscrito = (document.getElementById("nombre") || {}).value;
    Array.prototype.forEach.call(document.querySelectorAll("dialog.ventana"), function (d) { if (!d.open) d.remove(); });
    app.innerHTML = "";
    [portada, cuposArriba, detalles, colaboracion, confirmar, yape, cierre].forEach(function (fn) { var n = fn(D); if (n) app.appendChild(n); });
    var abajo = document.getElementById("filme-abajo");
    if (abajo && !abajo.firstChild) { var t2 = filme(D, true); if (t2) abajo.appendChild(t2); }
    var pie = document.getElementById("pie"); pie.innerHTML = "";
    pie.appendChild(el("footer", null, "Hecho con cariño para celebrar juntos", D.actualizado ? el("br") : null, D.actualizado ? "Actualizado: " + D.actualizado : null));
    if (nombreEscrito && document.getElementById("nombre")) document.getElementById("nombre").value = nombreEscrito;
  }

  function iniciar() {
    var D = window.DATOS;
    var app = document.getElementById("app");
    if (!D || typeof D !== "object") {
      app.appendChild(el("div", { class: "error-datos" },
        el("strong", { text: "No se pudieron leer los datos. " }),
        "Revisa datos.js: suele ser una coma o una comilla que falta en la última línea que editaste."));
      return;
    }
    API_URL = String(D.api || "").trim();
    if (D.borrador) document.getElementById("aviso").appendChild(el("div", { class: "aviso", text: "Borrador: la página aún no está publicada." }));
    if (D.fiesta && D.fiesta.anfitrion) document.title = "Mi cumpleaños · " + D.fiesta.anfitrion;
    var tira = filme(D); if (tira) { document.getElementById("filme").appendChild(tira); document.getElementById("filme").appendChild(controlVelocidad()); }
    render(D);
    musica(D);
    juego(D);
    setTimeout(function () { confeti(90); }, 700);
    if (API_URL) {
      fetch(API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") + "accion=estado&t=" + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (E) { if (E && E.ok) { aplicarEstado(D, E); render(D); } })
        .catch(function () {});
    }
  }

  if (window.DATOS) { iniciar(); return; }
  // datos.js se pide siempre "fresco" para que los cambios se vean al instante
  var s = document.createElement("script");
  s.src = "datos.js?v=" + Date.now();
  s.onload = iniciar;
  s.onerror = iniciar;
  document.head.appendChild(s);
})();
</script>
</body>
